[project]
name = "multi-agent-research-orchestrator"
version = "0.1.0"
description = "Production-grade LangGraph research orchestration system with verification, citations, and confidence scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Systems Builder Portfolio" }]
dependencies = [
  "anthropic>=0.40.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "orjson>=3.10.0",
  "prometheus-client>=0.21.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "tavily-python>=0.5.0",
  "tenacity>=9.0.0",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  "ruff>=0.7.0"
]

[project.scripts]
research-evaluate = "research_orchestrator.evaluation.runner:app"

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "backend"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

